<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#17121f"/>
      <stop offset="0.55" stop-color="#0d0a12"/>
      <stop offset="1" stop-color="#07060a"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.38" cy="0.36" r="0.60">
      <stop offset="0" stop-color="#8d54ff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#8d54ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8d54ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.80" cy="0.84" r="0.55">
      <stop offset="0" stop-color="#fb2c36" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fb2c36" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="0" y1="202" x2="0" y2="822">
      <stop offset="0" stop-color="#f3ecff"/>
      <stop offset="0.35" stop-color="#c3aaff"/>
      <stop offset="0.72" stop-color="#9a6bff"/>
      <stop offset="1" stop-color="#7434ea"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="hair" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="229" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="229" fill="url(#aura)"/>
  <rect width="1024" height="1024" rx="229" fill="url(#warm)"/>

  <g filter="url(#soft)" opacity="0.50" fill="url(#bar)">
    <rect x="238" y="202"   width="56" height="620" rx="28" fill-opacity="1.00"/>
    <rect x="320" y="243"   width="56" height="538" rx="28" fill-opacity="0.93"/>
    <rect x="402" y="283.5" width="56" height="457" rx="28" fill-opacity="0.86"/>
    <rect x="484" y="324.5" width="56" height="375" rx="28" fill-opacity="0.79"/>
    <rect x="566" y="365.5" width="56" height="293" rx="28" fill-opacity="0.72"/>
    <rect x="648" y="406"   width="56" height="212" rx="28" fill-opacity="0.65"/>
    <rect x="730" y="447"   width="56" height="130" rx="28" fill-opacity="0.58"/>
  </g>

  <g fill="url(#bar)">
    <rect x="238" y="202"   width="56" height="620" rx="28" fill-opacity="1.00"/>
    <rect x="320" y="243"   width="56" height="538" rx="28" fill-opacity="0.93"/>
    <rect x="402" y="283.5" width="56" height="457" rx="28" fill-opacity="0.86"/>
    <rect x="484" y="324.5" width="56" height="375" rx="28" fill-opacity="0.79"/>
    <rect x="566" y="365.5" width="56" height="293" rx="28" fill-opacity="0.72"/>
    <rect x="648" y="406"   width="56" height="212" rx="28" fill-opacity="0.65"/>
    <rect x="730" y="447"   width="56" height="130" rx="28" fill-opacity="0.58"/>
  </g>

  <rect width="1024" height="1024" rx="229" fill="url(#vignette)"/>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="228" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="3" filter="url(#hair)"/>
</svg>
